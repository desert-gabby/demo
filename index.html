<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Counter</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f2f3f5;
      --muted: #9a9fac;
      --accent: #ff5d73;
      --accent-soft: rgba(255, 93, 115, 0.16);
      --ring: rgba(255, 93, 115, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1b1f28, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 2.75rem 3rem;
      width: min(360px, 90vw);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .eyebrow {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }

    h1 {
      margin: 0 0 1.75rem;
      font-size: 1.3rem;
      font-weight: 600;
    }

    .count {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      margin: 0 0 1.75rem;
      font-variant-numeric: tabular-nums;
      transition: transform 0.12s ease;
    }

    .count.pulse { transform: scale(1.12); }

    .btn-row {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
    }

    button {
      font-family: inherit;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
    }

    .tap {
      flex: 1;
      padding: 0.95rem 1.2rem;
      font-size: 1rem;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 10px 24px var(--accent-soft);
    }

    .tap:hover { transform: translateY(-2px); }
    .tap:active { transform: translateY(0) scale(0.97); }

    .reset {
      padding: 0.95rem 1.1rem;
      font-size: 0.85rem;
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .reset:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.28); }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    kbd {
      background: rgba(255, 255, 255, 0.08);
      padding: 0.1em 0.45em;
      border-radius: 5px;
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Dummy demo app</p>
    <h1>Pulse Counter</h1>
    <p class="count" id="count">0</p>
    <div class="btn-row">
      <button class="tap" id="tapBtn">Tap +1</button>
      <button class="reset" id="resetBtn">Reset</button>
    </div>
    <p class="hint">Also works with <kbd>Space</kbd>. Count is saved locally.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
