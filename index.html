<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concierge — AI Demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="chat-header">
      <div class="avatar">✦</div>
      <div class="header-text">
        <h1>Concierge</h1>
        <p class="status"><span class="dot"></span> Online — simulated demo</p>
      </div>
    </header>

    <main class="chat-window" id="chatWindow" aria-live="polite">
      <!-- messages injected here -->
    </main>

    <div class="quick-replies" id="quickReplies">
      <button class="chip" data-msg="What time is check-in and check-out?">Check-in/out times</button>
      <button class="chip" data-msg="Can you recommend a restaurant nearby?">Restaurant recs</button>
      <button class="chip" data-msg="What's the wifi password?">Wifi password</button>
      <button class="chip" data-msg="Can I book a spa appointment?">Book spa</button>
    </div>

    <form class="composer" id="composer">
      <input
        type="text"
        id="messageInput"
        placeholder="Ask the concierge anything…"
        autocomplete="off"
        aria-label="Message"
      />
      <button type="submit" class="send-btn" aria-label="Send message">➤</button>
    </form>

    <p class="disclaimer">Demo concierge — replies are simulated, not a real AI model.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
