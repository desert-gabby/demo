<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReFlight — Flight Tickets</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✈</span> ReFlight</div>
    <p class="tagline">Sample flight ticket demo — no real bookings</p>
  </header>

  <main class="wrap">
    <!-- Step 1: Search -->
    <section class="step" id="step-search">
      <div class="card search-card">
        <h1>Find your flight</h1>
        <form id="searchForm" class="search-form">
          <div class="field">
            <label for="origin">From</label>
            <select id="origin" required></select>
          </div>
          <div class="field swap-field">
            <button type="button" id="swapBtn" class="swap-btn" aria-label="Swap origin and destination">⇄</button>
          </div>
          <div class="field">
            <label for="destination">To</label>
            <select id="destination" required></select>
          </div>
          <div class="field">
            <label for="travelDate">Departure date</label>
            <input type="date" id="travelDate" required />
          </div>
          <div class="field">
            <label for="passengers">Passengers</label>
            <select id="passengers">
              <option value="1">1 passenger</option>
              <option value="2">2 passengers</option>
              <option value="3">3 passengers</option>
              <option value="4">4 passengers</option>
            </select>
          </div>
          <button type="submit" class="btn-primary search-btn">Search flights</button>
        </form>
      </div>
    </section>

    <!-- Step 2: Results -->
    <section class="step hidden" id="step-results">
      <button class="back-link" data-back="step-search">← New search</button>
      <h2 id="resultsTitle">Flights</h2>
      <div class="results-list" id="resultsList"></div>
    </section>

    <!-- Step 3: Passenger details -->
    <section class="step hidden" id="step-details">
      <button class="back-link" data-back="step-results">← Back to results</button>
      <div class="card">
        <h2>Passenger details</h2>
        <div class="flight-summary" id="flightSummary"></div>
        <form id="detailsForm" class="details-form">
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" placeholder="As it appears on ID" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="seatPref">Seat preference</label>
            <select id="seatPref">
              <option value="window">Window</option>
              <option value="aisle">Aisle</option>
              <option value="middle">Middle</option>
              <option value="none">No preference</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">Confirm booking</button>
        </form>
      </div>
    </section>

    <!-- Step 4: Ticket -->
    <section class="step hidden" id="step-ticket">
      <button class="back-link" data-back="step-search">← Book another flight</button>
      <div class="ticket" id="ticketCard"></div>
      <div class="ticket-actions">
        <button class="btn-secondary" id="printTicket">Print / Save as PDF</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
